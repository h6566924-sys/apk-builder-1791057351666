name: Build Kotlin APK V17
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: android-actions/setup-android@v3
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.22.3
    - name: Build Kotlin Real Android
      run: |
        echo "App: MyApp Package: com.example.myapp Type: Kotlin"
        if [ -f pubspec.yaml ]; then flutter pub get; flutter build apk --debug; fi
        if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug || true; fi
        if [ -f build.gradle ]; then gradle assembleDebug || true; fi
        if [ -f index.html ]; then npm init -y; npm install @capacitor/core @capacitor/cli @capacitor/android; npx cap init "MyApp" com.example.myapp --web-dir=. || true; npx cap add android; npx cap copy; cd android; chmod +x gradlew; ./gradlew assembleDebug; fi
        find . -name "*.apk" -type f
    - uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: "**/*.apk"
